.hud-root { position: absolute; overflow: hidden; pointer-events: none; z-index: 10;
  font-family: ${G_}; font-weight: 900; user-select: none; }
.hud-root * { box-sizing: border-box; }

/* -- the watts plate ----------------------------------------------------- */
.hud-plate { position: absolute; display: flex; align-items: center; gap: 0.6em;
  padding: 0.45em 0.9em; border-radius: 1.2em; border: 0.16em solid rgba(244,233,210,0.45);
  background: rgba(28,28,36,0.85); color: #fff; }
.hud-plate.hud-power-on { border-color: #e9b75a;
  background: rgba(64,50,18,0.88); box-shadow: 0 0 1.4em rgba(255,214,140,0.8); }
.hud-plate.hud-power-over { border-color: #ff5a36; background: rgba(96,26,10,0.88); }
.hud-plate.hud-power-under { border-color: #4aa8ff; background: rgba(12,42,86,0.88); }
.hud-plate-pulse { animation: hud-plate-pulse 0.4s ease-out; }
/* The indicator slot. Two independent signals share it and they must not be
   welded together:
     - WHICH SIDE of the target the rider is on -> the hue, from the
       .hud-power-* class the plate already carries (red over, blue under);
     - WHAT TO DO about it -> the glyph, from the .hud-ind-* class render()
       stamps out of powerIndicator() in model.ts.
   The glyph rules below are tautologies (-up shows the up chevron), so no
   over/under decision can hide in this stylesheet again. The chevrons take
   their colour from the slot's own color, so the hue follows the STATE even
   though the arrow points at the ACTION. */
.hud-ind { width: 2.6em; display: flex; align-items: center; justify-content: center;
  color: #ffd68c; }
.hud-power-over .hud-ind { color: #ff5a36; }
.hud-power-under .hud-ind { color: #4aa8ff; }
.hud-chev-up { width: 0; height: 0; border-left: 1.1em solid transparent;
  border-right: 1.1em solid transparent; border-bottom: 1.5em solid currentColor; display: none; }
.hud-chev-down { width: 0; height: 0; border-left: 1.1em solid transparent;
  border-right: 1.1em solid transparent; border-top: 1.5em solid currentColor; display: none; }
/* The on-target pip. Named -pip and not -dot so the three GLYPH classes and
   the three STATE classes (hud-ind-up / -down / -dot) cannot collide. */
.hud-ind-pip { width: 1.2em; height: 1.2em; border-radius: 50%; background: #ffd68c;
  box-shadow: 0 0 0.9em rgba(255,214,140,0.95); display: none; }
.hud-ind-up .hud-chev-up, .hud-ind-down .hud-chev-down { display: block;
  animation: hud-chev-bounce 0.45s ease-in-out infinite alternate; }
.hud-ind-dot .hud-ind-pip { display: block; }
.hud-watts { display: flex; align-items: baseline; gap: 0.25em; line-height: 1; }
.hud-watts-num { font-size: 2em; font-variant-numeric: tabular-nums; }
.hud-power-over .hud-watts-num { color: #ffab8f; }
.hud-power-under .hud-watts-num { color: #8fc6ff; }
.hud-watts-unit { font-size: 0.9em; opacity: 0.8; }
.hud-target { font-size: 0.85em; color: #f4e9d2; letter-spacing: 0.05em; line-height: 1.3; }
.hud-block { font-size: 0.7em; color: #e9b75a; letter-spacing: 0.12em; line-height: 1.2; }

/* -- the NEXT chip ------------------------------------------------------- */
.hud-chip { position: absolute; padding: 0.25em 0.9em; border-radius: 2em;
  background: #e9b75a; color: #2a2118; white-space: nowrap; letter-spacing: 0.04em;
  transition: transform 0.25s ease-out, opacity 0.25s ease-out; }
.hud-chip-hidden { opacity: 0; transform: translateY(70%); }

/* -- the race clock ------------------------------------------------------ */
.hud-clock { position: absolute; padding: 0.28em 0.85em; border-radius: 2em;
  background: rgba(28,28,36,0.85); color: #fff; font-variant-numeric: tabular-nums;
  letter-spacing: 0.03em; }

/* -- the position badge -------------------------------------------------- */
.hud-badge { position: absolute; }
.hud-badge svg { display: block; width: 100%; height: 100%; overflow: visible; }
.hud-badge-text, .hud-badge-shadow { font-family: ${G_}; font-weight: 900;
  font-size: 150px; paint-order: stroke fill; stroke-linejoin: round; text-anchor: middle; }
.hud-badge-suffix { font-size: 62px; }
.hud-badge-shadow { fill: rgba(40,18,8,0.5); stroke: rgba(40,18,8,0.5); stroke-width: 26px; }
.hud-badge-text { stroke-width: 22px; }
/* Paused and posed by race time, exactly like the callout (see .hud-otk):
   a commit replayed by a fast-forward must not leave a wall-clock pop
   mid-scale in a plate posed long after it. */
.hud-badge-pop { animation: hud-badge-pop ${Y_}s ease-out both;
  animation-play-state: paused; transform-origin: 50% 60%; }
.hud-badge-dnf { filter: saturate(0.25) brightness(0.65); }

/* -- the rank ladder ------------------------------------------------------ */
/* hud-01's roster, at four: kart-colour chips stacked in committed race
   order, throne slot crowned, the player's chip ringed (hud-04's map ring).
   Chips move BETWEEN slots by transform only, so a reorder is one composited
   slide per chip and a steady race writes nothing. */
.hud-ladder { position: absolute; }
.hud-ladder-crown { position: absolute; left: 50%; }
.hud-ladder-chip { position: absolute; left: 0; top: 0; width: 100%;
  border-radius: 26%; border-style: solid; border-color: rgba(40,18,8,0.85);
  box-shadow: 0 0.08em 0 rgba(40,18,8,0.35);
  transition: transform 0.35s cubic-bezier(0.3, 1.4, 0.5, 1); }
.hud-ladder-chip svg { display: block; width: 100%; height: 100%; }
.hud-ladder-you { border-color: #fff;
  box-shadow: 0 0 0 0.12em rgba(40,18,8,0.85), 0 0.08em 0 rgba(40,18,8,0.35); }

/* -- the overtake callout ------------------------------------------------- */
/* The EVENT: the crossed rival's kart chip physically passes the badge -
   falling when the player took the place, rising when the rival did - while
   chevrons burst in the direction the player went. Base state is invisible
   and the animation carries all visibility, so with prefers-reduced-motion
   the callout simply never shows.

   The animations are PAUSED and posed by render() with a negative delay
   computed from RACE time - never left running on the wall clock. A ?t=N
   fast-forward replays every commit through the model in a tight loop; a
   wall-clock animation started there would still be mid-flight in a plate
   posed minutes past the event (racefilm caught exactly that: the t=4s
   callout frozen in the t=30s frame). Race-time posing shows what a live
   viewer at that clock sees, and in live play render() runs per frame so
   the motion is identical. */
.hud-otk { position: absolute; pointer-events: none; }
.hud-otk-chip { position: absolute; left: 50%; opacity: 0; will-change: transform;
  animation-play-state: paused; }
.hud-otk-chip svg { display: block; width: 100%; height: 100%;
  filter: drop-shadow(0 0.06em 0 rgba(40,18,8,0.45)); }
.hud-otk-gained .hud-otk-chip { animation-name: hud-otk-fall; }
.hud-otk-lost .hud-otk-chip { animation-name: hud-otk-rise; }
.hud-otk-gained .hud-otk-chip, .hud-otk-lost .hud-otk-chip {
  animation-duration: ${K_}s; animation-fill-mode: both;
  animation-timing-function: cubic-bezier(0.5, 0, 0.6, 1); }
.hud-otk-chev { position: absolute; left: 50%; opacity: 0;
  animation-play-state: paused; }
.hud-otk-chev svg { display: block; width: 100%; height: 100%; }
.hud-otk-gained .hud-otk-chev { animation-name: hud-otk-chev-up; }
.hud-otk-lost .hud-otk-chev { animation-name: hud-otk-chev-down; }
.hud-otk-gained .hud-otk-chev, .hud-otk-lost .hud-otk-chev {
  animation-duration: ${q_}s; animation-fill-mode: both;
  animation-timing-function: ease-out; }

/* -- transitions fire on state changes only; motion is transform/opacity -- */
@keyframes hud-badge-pop { 0% { transform: scale(1); } 35% { transform: scale(1.22); }
  70% { transform: scale(0.96); } 100% { transform: scale(1); } }
@keyframes hud-chev-bounce { from { transform: translateY(-12%); } to { transform: translateY(12%); } }
@keyframes hud-plate-pulse { 0% { transform: scale(1); } 40% { transform: scale(1.06); }
  100% { transform: scale(1); } }
/* translateY percentages are of the CHIP's own height; layout sizes the chip
   at exactly 1/5 of the callout corridor, so 400% is precisely "from the top
   of the corridor to its floor" - a fall that crosses the numeral band. */
@keyframes hud-otk-fall {
  0% { transform: translate(-50%, 0) scale(0.85); opacity: 0; }
  12% { opacity: 1; transform: translate(-50%, 48%) scale(1.08); }
  82% { opacity: 1; }
  100% { transform: translate(-50%, 400%) scale(0.92); opacity: 0; } }
@keyframes hud-otk-rise {
  0% { transform: translate(-50%, 400%) scale(0.85); opacity: 0; }
  12% { opacity: 1; transform: translate(-50%, 352%) scale(1.08); }
  82% { opacity: 1; }
  100% { transform: translate(-50%, 0) scale(0.92); opacity: 0; } }
@keyframes hud-otk-chev-up {
  0% { transform: translate(-50%, 60%); opacity: 0; }
  25% { opacity: 1; }
  100% { transform: translate(-50%, -70%); opacity: 0; } }
@keyframes hud-otk-chev-down {
  0% { transform: translate(-50%, -70%) scaleY(-1); opacity: 0; }
  25% { opacity: 1; }
  100% { transform: translate(-50%, 60%) scaleY(-1); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .hud-root * { animation: none !important; transition: none !important; }
}

 * whole of piece 12's remaining stutter: 2-4 dropped frames at every stage's
 * first paint over it, invisible in every plate for three rounds. The stage's
 * defocus now happens inside the renderer's own GL context — src/render/defocus.ts
 * carries the measurement and the arms. Nothing in this stylesheet may put a
 * filter on a viewport-sized box; test/endgame/scrim.test.ts holds that. */
.eg-scrim {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 90% at 50% 20%, rgba(66, 86, 148, 0.28) 0%, rgba(40, 34, 52, 0.62) 100%);
}

/* ---------------------------------------------------------------- banner -- */
.eg-banner {
  position: absolute;
  left: 0; right: 0; top: 26%;
  text-align: center;
}
.eg-banner-swash {
  position: absolute;
  /* Centred on the TITLE's glyphs, not on the banner box: the banner's height
   * includes the sub line, so a percentage here slides the plate down and the
   * arch ends up riding the plate's top edge. 4.3em = half the 9.5em title,
   * less the arch's upward lift. */
  left: 50%; top: 4.3em;
  width: 74em; height: 12em;
  background: ${ix};
  border-radius: 6em / 4.4em;
  transform: translate(-50%, -50%) rotate(-2.2deg);
  box-shadow: 0 0.7em 0 rgba(0,0,0,0.25);
}
.eg-banner-swash::after {
  content: '';
  position: absolute;
  inset: 0.9em 1.1em;
  border: 0.42em dotted rgba(255, 214, 140, 0.85);
  border-radius: 5em / 3.6em;
}
.eg-banner[data-win='0'] .eg-banner-swash { background: ${ox}; }
.eg-banner-title {
  position: relative;
  font-size: 9.5em;
  line-height: 1;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.eg-banner-title span {
  display: inline-block;
  background: linear-gradient(180deg, ${sx} 8%, ${cx} 55%, ${lx} 92%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 0.028em ${Qb};
  filter: drop-shadow(0 0.045em 0 ${Qb}) drop-shadow(0 0.09em 0 rgba(0,0,0,0.3));
}
.eg-banner[data-win='0'] .eg-banner-title span {
  background: linear-gradient(180deg, #ffffff 8%, ${$b} 50%, ${ex} 92%);
  -webkit-background-clip: text;
  background-clip: text;
}
.eg-banner-sub {
  position: relative;
  /* Clears the plate's lower lip (plate bottom sits ~10.3 root-em down). */
  margin-top: 0.45em;
  font-size: 3.1em;
  font-weight: 600;
  color: ${$b};
  text-shadow: 0 0.06em 0 ${Qb};
}

/* ------------------------------------------------------------- standings -- */
.eg-standings {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 150em;
}
/* Rows on the left, the RENDERED grand-prize trophy on the right — the bar's
   results frame (reference/bar/results-01) anchors its whole composition on a
   dimensional trophy filling roughly a third of the frame beside the
   placings; the trophy canvas plays that role here. Its sway is driven by
   the view model's sim-time clock (trophy.ts), never wall-clock CSS, so a
   posed \`?t=\` plate is deterministic under the capture harness. */
.eg-standings-body { display: flex; align-items: center; gap: 3em; }
.eg-rows-col { position: relative; flex: 1 1 auto; }
.eg-prize-col {
  position: relative;
  flex: 0 0 58em;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.eg-prize-burst {
  position: absolute;
  left: 50%; top: 24em;
  width: 54em; height: 54em;
  transform: translate(-50%, -50%);
  background:
    repeating-conic-gradient(rgba(255, 233, 160, 0.30) 0deg 9deg, rgba(233, 183, 90, 0.07) 9deg 24deg);
  border-radius: 50%;
  -webkit-mask-image: radial-gradient(circle, #000 30%, transparent 68%);
  mask-image: radial-gradient(circle, #000 30%, transparent 68%);
}
/* The trophy's canvas: 58 x 90 root-em. With the camera's 5 % margin the
   trophy inside it spans ~28 % of the 177.78em frame width and ~86 % of its
   height — results-01's trophy fraction (~28 % x ~91 %, measured off the
   bar frame). Sized here in CSS; trophy.ts reads the laid-out size for its
   drawing buffer. */
.eg-trophy { position: relative; display: block; width: ${ux}em; height: ${dx}em; }
.eg-prize-name {
  position: relative;
  /* Rides up onto the trophy's wood base — the canvas's bottom tenth is the
     dark plinth, and the caption doubles as its plaque line. Keeps the whole
     column inside the 100em frame at the larger canvas size. */
  margin-top: -2em;
  font-size: 2.9em;
  line-height: 1.1;
  white-space: nowrap;
  background: linear-gradient(180deg, ${sx} 8%, ${cx} 55%, ${lx} 92%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 0.026em ${Qb};
  filter: drop-shadow(0 0.05em 0 ${Qb});
}
.eg-standings-head {
  text-align: center;
  font-size: 5.6em;
  line-height: 1.1;
  margin-bottom: 0.5em;
  background: linear-gradient(180deg, ${sx} 8%, ${cx} 55%, ${lx} 92%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 0.026em ${Qb};
  filter: drop-shadow(0 0.05em 0 ${Qb});
}
.eg-rows { display: flex; flex-direction: column; gap: 1.5em; }
.eg-row {
  display: flex;
  align-items: center;
  gap: 2em;
  height: 8.6em;
  padding: 0 2.6em;
  border-radius: 4.3em;
  background: rgba(30, 26, 40, 0.72);
  border: 0.35em solid rgba(244, 233, 210, 0.28);
  box-shadow: 0 0.5em 0 rgba(0,0,0,0.28);
}
.eg-row[data-first='1'] {
  background: linear-gradient(180deg, ${sx} 0%, ${cx} 60%, ${lx} 100%);
  border-color: #fff3cf;
  color: ${Qb};
}
.eg-row[data-player='1'][data-first='0'] { border-color: ${cx}; }
.eg-row[data-dnf='1'] { opacity: 0.82; }
.eg-place {
  flex: 0 0 auto;
  width: 5.6em; height: 5.6em;
  border-radius: 50%;
  border: 0.4em solid ${Qb};
  display: flex; align-items: center; justify-content: center;
  font-size: 1em;
  box-shadow: inset 0 -0.9em 0 rgba(0,0,0,0.18), 0 0.25em 0 rgba(0,0,0,0.25);
}
.eg-place span {
  font-size: 2.6em;
  color: #fff;
  text-shadow: 0 0.07em 0 ${Qb};
}
.eg-row-name { flex: 1 1 auto; font-size: 3.4em; text-shadow: 0 0.05em 0 rgba(0,0,0,0.35); }
.eg-row[data-first='1'] .eg-row-name { text-shadow: 0 0.05em 0 rgba(255,255,255,0.4); }
.eg-row-gap { flex: 0 0 auto; font-size: 2.6em; font-weight: 600; opacity: 0.85; }
.eg-row-time { flex: 0 0 auto; font-size: 3.1em; font-variant-numeric: tabular-nums; }
.eg-photo {
  position: absolute;
  right: -7em; top: -3.4em;
  transform: rotate(8deg);
  font-size: 2.9em;
  padding: 0.3em 0.8em;
  border-radius: 0.5em;
  background: ${ix};
  color: #fff;
  border: 0.13em solid ${Qb};
  text-shadow: 0 0.06em 0 ${Qb};
  box-shadow: 0 0.2em 0 rgba(0,0,0,0.3);
}
.eg-teaser {
  position: relative;
  margin-top: 0.5em;
  text-align: center;
  font-size: 2.3em;
  font-weight: 600;
  color: ${rx};
  text-shadow: 0 0.06em 0 ${Qb};
  letter-spacing: 0.08em;
}
.eg-teaser::before, .eg-teaser::after { content: ' ★ '; color: ${cx}; }

/* ------------------------------------------------------------------ wall -- */
.eg-wall {
  position: absolute;
  left: 50%; top: 50%;
  width: 96em;
  transform: translate(-50%, -50%);
}
.eg-cabinet {
  position: relative;
  border-radius: 2.4em;
  background: linear-gradient(180deg, ${tx} 0%, ${nx} 100%);
  border: 0.9em solid ${Qb};
  box-shadow: 0 1.2em 0 rgba(0,0,0,0.35), inset 0 0 0 0.8em ${rx};
  padding: 3.2em 6.4em 2.6em;
}
/* Carnival light strips down both inner edges — prize-01's cabinet runs LED
   columns the full height of the machine, and they are what say "machine"
   rather than "panel". Static dots: endgame motion is sim-clock-driven, and a
   wall-clock twinkle here would be the one element a posed plate cannot pin. */
.eg-led {
  position: absolute;
  top: 2.2em; bottom: 2.2em;
  width: 1.7em;
  border-radius: 0.85em;
  background-color: rgba(30, 26, 40, 0.55);
  background-image: radial-gradient(circle at 50% 50%, ${sx} 0 28%, rgba(240, 181, 42, 0.55) 40%, transparent 52%);
  background-size: 1.7em 3.1em;
  background-repeat: repeat-y;
  background-position: 0 1em;
  box-shadow: inset 0 0 0 0.22em rgba(74, 40, 36, 0.8);
}
.eg-led[data-side='left'] { left: 2.3em; }
.eg-led[data-side='right'] { right: 2.3em; }
.eg-cabinet::before {
  /* drape header, prize-01's red valance */
  content: '';
  position: absolute;
  left: 1.4em; right: 1.4em; top: -1.1em;
  height: 4.6em;
  background: ${ax};
  border: 0.55em solid ${Qb};
  border-radius: 2.2em 2.2em 3.6em 3.6em / 2.2em 2.2em 2.6em 2.6em;
  box-shadow: 0 0.5em 0 rgba(0,0,0,0.3);
}
.eg-wall-title {
  position: relative;
  z-index: 1;
  text-align: center;
  font-size: 4.4em;
  line-height: 1;
  margin-bottom: 0.35em;
  background: linear-gradient(180deg, ${sx} 8%, ${cx} 55%, ${lx} 92%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 0.024em ${Qb};
  filter: drop-shadow(0 0.05em 0 ${Qb});
}
.eg-wall-sub {
  text-align: center;
  font-size: 2.3em;
  font-weight: 600;
  margin-bottom: 1em;
  color: ${$b};
  text-shadow: 0 0.05em 0 ${Qb};
}
.eg-shelves {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 1.2em;
  /* room on the left for the jet lane */
  margin-left: 14em;
}
.eg-shelf {
  position: relative;
  display: flex;
  align-items: center;
  gap: 2em;
  height: 12.4em;
  padding: 0 3.2em 0 2.2em;
  border-radius: 1.6em;
  /* The backboard behind the stock: prize-01's cabinet interior is diagonal-
     striped glass, and a flat bar here read as a menu row. Same stripe idea,
     spoken in the dusk palette. */
  background:
    repeating-linear-gradient(55deg, rgba(244, 233, 210, 0.07) 0 2.6em, rgba(244, 233, 210, 0) 2.6em 5.2em),
    rgba(30, 26, 40, 0.55);
  border: 0.4em solid rgba(74, 40, 36, 0.9);
  box-shadow: inset 0 -1em 0 rgba(0,0,0,0.25);
}
.eg-shelf::after {
  /* the plank the stock stands on */
  content: '';
  position: absolute;
  left: 0.8em; right: 0.8em; bottom: 0.35em;
  height: 1em;
  border-radius: 0.5em;
  background: ${nx};
  box-shadow: 0 0.22em 0 ${Qb};
}
/* The wall reads around the pick: the aimed shelf is lit, its neighbours step
   back — hud-05's selected card against its dimmed row. */
.eg-shelf[data-selected='0'] .eg-stock,
.eg-shelf[data-selected='0'] .eg-shelf-tag { filter: brightness(0.82) saturate(0.85); }
.eg-shelf[data-selected='1'] {
  border-color: ${cx};
  background:
    repeating-linear-gradient(55deg, rgba(255, 233, 160, 0.10) 0 2.6em, rgba(255, 233, 160, 0.02) 2.6em 5.2em),
    rgba(42, 34, 46, 0.62);
  box-shadow: inset 0 -1em 0 rgba(0,0,0,0.25), 0 0 2.4em rgba(240, 181, 42, 0.75);
}
/* Taking a prize takes ONE: the front copy leaves with the winner, the rest of
   the row stays stocked — the wall is a shop, not a checklist. */
.eg-shelf[data-claimed='1'] .eg-shelf-art[data-front='1'] { visibility: hidden; }
.eg-shelf-burst {
  position: absolute;
  left: 1.6em; top: 50%;
  width: 13.5em; height: 13.5em;
  transform: translate(0, -50%);
  background: repeating-conic-gradient(rgba(255, 233, 160, 0.5) 0deg 11deg, rgba(255, 233, 160, 0) 11deg 30deg);
  border-radius: 50%;
  visibility: hidden;
}
.eg-shelf[data-selected='1'] .eg-shelf-burst { visibility: visible; }
/* the row of stock: three of each plushie standing on the plank */
.eg-stock {
  position: relative;
  display: flex;
  align-items: flex-end;
  flex: 0 0 auto;
  height: 100%;
  padding-bottom: 1.1em;
}
/* The stock is bitmaps, not inline svg, and the two em numbers below are the
   raster size — see src/endgame/wall-art.ts for the measurement that put them
   there, and test/endgame/wall-art.test.ts, which reads them back out of this
   stylesheet so the bitmap can never be drawn at a size it was not rasterised
   at. Change one and change the other. */
.eg-shelf-art { position: relative; width: 10em; height: 10em; flex: 0 0 auto; }
.eg-shelf-art img { width: 100%; height: 100%; display: block; }
/* The back copies sit tucked behind the front one, a plush pile not a chart.
   The brightness stays HERE rather than being baked into the bitmap: baking it
   would remove ten render surfaces from the entering frame, and it also changes
   22-35 % of the copy's pixels, because a CSS filter darkens what was
   composited and a baked one darkens the source. See wall-art.ts. */
.eg-shelf-art[data-front='0'] { width: 8.8em; height: 8.8em; margin-right: -2.6em; }
.eg-shelf-art[data-front='0'] img { filter: brightness(0.86); }
/* chunky pick cursor at the shelf's right edge, hud-05's hand-off cursor */
.eg-cursor {
  position: absolute;
  right: -1.4em; top: 50%;
  width: 0; height: 0;
  transform: translateY(-50%);
  border-top: 1.6em solid transparent;
  border-bottom: 1.6em solid transparent;
  border-right: 2.4em solid ${cx};
  filter: drop-shadow(-0.18em 0 0 ${Qb}) drop-shadow(0.18em 0.18em 0 ${Qb});
  visibility: hidden;
}
.eg-shelf[data-selected='1'] .eg-cursor { visibility: visible; }
.eg-shelf-tag {
  position: relative;
  flex: 0 0 auto;
  transform: rotate(-3deg);
  background: ${$b};
  color: ${Qb};
  border: 0.28em solid ${Qb};
  border-radius: 0.7em;
  padding: 0.45em 1.2em 0.55em;
  box-shadow: 0 0.3em 0 rgba(0,0,0,0.3);
}
.eg-shelf-tag::before {
  /* tag string hole, hud-05's price-tag language */
  content: '';
  position: absolute;
  left: -0.5em; top: 50%;
  width: 0.9em; height: 0.9em;
  transform: translateY(-50%);
  background: ${ex};
  border: 0.22em solid ${Qb};
  border-radius: 50%;
}
.eg-shelf-name { font-size: 2.5em; line-height: 1.05; margin-left: 0.3em; }
.eg-shelf-pitch { font-size: 1.7em; font-weight: 600; opacity: 0.75; margin-left: 0.45em; }
.eg-grand {
  position: absolute;
  right: -2.6em; top: -2.2em;
  transform: rotate(10deg);
  font-size: 1.9em;
  padding: 0.25em 0.7em;
  border-radius: 0.5em;
  background: ${ix};
  color: #fff;
  border: 0.14em solid ${Qb};
  text-shadow: 0 0.06em 0 ${Qb};
  box-shadow: 0 0.2em 0 rgba(0,0,0,0.3);
}

/* the jet lane: nozzle at the bottom, beam up to the aimed shelf */
.eg-jet { position: absolute; inset: 0; pointer-events: none; }
.eg-jet-beam {
  position: absolute;
  transform-origin: 0 50%;
  height: 1.15em;
  border-radius: 0.6em;
  background: linear-gradient(180deg, #ffffff 0%, #bde4ff 45%, #7ec3f2 100%);
  border: 0.16em solid rgba(74, 40, 36, 0.55);
}
.eg-jet-splash {
  position: absolute;
  width: 3.4em; height: 3.4em;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #ffffff 0%, #bde4ff 55%, #7ec3f2 100%);
  border: 0.2em solid rgba(74, 40, 36, 0.55);
}
.eg-jet-nozzle {
  position: absolute;
  width: 4.6em; height: 6.2em;
  transform: translate(-50%, 0);
  background: ${ox};
  border: 0.4em solid ${Qb};
  border-radius: 1.2em 1.2em 0.6em 0.6em;
  box-shadow: inset 0 0.8em 0 rgba(255,255,255,0.12);
}
.eg-claim {
  position: absolute;
  width: 13.4em; height: 13.4em;
  transform: translate(-50%, -50%);
}
.eg-claim circle { fill: none; stroke-linecap: round; }

/* ---------------------------------------------------------------- payoff -- */
.eg-payoff {
  position: absolute;
  left: 0; right: 0; top: 50%;
  transform: translateY(-50%);
  text-align: center;
}
/* The ground the rays stand on, and it is a legibility fix rather than glory.
 *
 * The rays are translucent warm gold — 0.6 alpha at their brightest — painted
 * straight onto the veiled stage. Behind the payoff sits the bullseye's blue
 * disc, defocused but still a large mid-value shape, and at AWARD_GLORY the
 * burst's painted reach is only about 1.3x the prize art. So the reward glow was
 * being OUT-COMPETED BY SCENERY: a big blue circle with a small gold thing in
 * front of it, rather than a prize with its own light around it. At glory 1.0 the
 * rays run off the top and bottom of the frame and this never happens, which is
 * exactly why round 5 and round 6 both looked at the winner's plate and saw
 * nothing wrong.
 *
 * The fix is figure-and-ground, not size. A soft pool of the scrim's own dusk ink
 * under the rays gives the burst something to stand on, so it reads as an object
 * rather than as a wash over the disc.
 *
 * TWO NUMBERS DECIDE IT AND BOTH ARE PINNED IN test/endgame/payoff-burst.test.ts:
 *
 *   * 56em box, so 28em of radius — WIDER than the 36em prize art's 18em, so the
 *     prize is never sitting on bare scenery;
 *   * and NOT wider than the burst it supports at the SMALLER glory: 0.55 x 52em
 *     is 28.6em. A ground that reached past the rays would read as a dark disc
 *     with a burst inside it, which is a worse figure than the one being fixed.
 *
 * It rides burst01 — the fan-out ramp — and NOT glory01. That is deliberate.
 * AWARD_GLORY's contract is "same language, plainly less of it"; a device that
 * appeared only when an AI wins would be DIFFERENT language, and a consolation
 * prize for the consolation prize. Both payoffs get the ground; the winner's rays
 * simply swallow it, being twice its radius and twice its opacity.
 *
 * closest-side and not the default: the default extent on a square box is the
 * half-DIAGONAL, so a stop at 100 % would land 41 % outside the border-radius
 * clip and the pool would end on a visible hard ring at a third of its alpha.
 *
 * NO BACKTICK MAY APPEAR IN THIS COMMENT. The whole stylesheet is one template
 * literal, and the first draft of this block used them for the two field names
 * above — which closed the literal mid-comment and took the file out with a
 * parse error. It is the same class of defect as round 5's unclosed brace, which
 * silently swallowed sixty-three rules including this one's neighbour.
 */
.eg-payoff-ground {
  position: absolute;
  left: 50%; top: 44%;
  width: 56em; height: 56em;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle closest-side,
    rgba(26, 20, 34, 0.88) 0%,
    rgba(26, 20, 34, 0.78) 38%,
    rgba(26, 20, 34, 0.34) 70%,
    rgba(26, 20, 34, 0) 100%);
}
.eg-payoff-burst {
  /* prize-02 fills the frame with rays behind the handed-over prize; ours were
     a polite halo. Bigger, denser, and reaching further before the fade. */
  position: absolute;
  left: 50%; top: 44%;
  width: 104em; height: 104em;
  transform: translate(-50%, -50%);
  background:
    repeating-conic-gradient(rgba(255, 233, 160, 0.6) 0deg 8deg, rgba(233, 183, 90, 0.14) 8deg 20deg);
  border-radius: 50%;
  -webkit-mask-image: radial-gradient(circle, #000 34%, transparent 72%);
  mask-image: radial-gradient(circle, #000 34%, transparent 72%);
}
.eg-payoff-art { position: relative; width: 36em; height: 36em; margin: 0 auto; }
.eg-payoff-art svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 1em 0 rgba(0,0,0,0.3)); }
.eg-payoff-title {
  position: relative;
  margin-top: 0.15em;
  font-size: 6.4em;
  line-height: 1;
  white-space: nowrap;
  background: linear-gradient(180deg, ${sx} 8%, ${cx} 55%, ${lx} 92%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 0.026em ${Qb};
  filter: drop-shadow(0 0.05em 0 ${Qb}) drop-shadow(0 0.1em 0 rgba(0,0,0,0.3));
}
.eg-payoff-sub {
  position: relative;
  margin-top: 0.5em;
  font-size: 2.8em;
  font-weight: 600;
  /* Always cream: the AI-award variant used to wear the winner's car colour
     here, and the blue car's blue on the dimmed backdrop was the lowest-
     contrast text in the endgame. The title line already names the winner;
     the sub's job is to be read. */
  color: ${$b};
  text-shadow: 0 0.06em 0 ${Qb};
}

/* --------------------------------------------------------------- rematch -- */
.eg-rematch {
  position: absolute;
  left: 50%; bottom: 5%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 2em;
  padding: 1.6em 3em;
  border-radius: 3.6em;
  background: rgba(30, 26, 40, 0.78);
  border: 0.4em solid ${rx};
  box-shadow: 0 0.6em 0 rgba(0,0,0,0.3);
}
.eg-hold { width: 6.4em; height: 6.4em; flex: 0 0 auto; }
.eg-hold circle { fill: none; stroke-linecap: round; }
.eg-rematch-text { text-align: left; }
.eg-rematch-prompt { font-size: 3em; line-height: 1.1; color: ${$b}; text-shadow: 0 0.06em 0 ${Qb}; }

/* No flex gap on the container, and that is load-bearing rather than a style choice: the
   warning below is now ALWAYS a flex item (see its rule), and a container gap is
   paid between items whether or not one of them has any size, so a gap would push
   the open panel 0.5em down whenever the warning was absent. The spacing is on the
   items instead, so an empty warning costs exactly nothing. */
.ag-vol { position: absolute; z-index: 50; pointer-events: none; user-select: none;
  font-family: ${VC}; font-weight: 900; color: #fff;
  display: flex; flex-direction: column; align-items: flex-start; }
.ag-vol-pill { margin-bottom: 0.5em; }
.ag-vol * { box-sizing: border-box; }
.ag-vol button { font: inherit; color: inherit; cursor: pointer; pointer-events: auto;
  border-radius: 2em; border: 0.16em solid rgba(244,233,210,0.45);
  background: rgba(28,28,36,0.85); }
.ag-vol button:disabled { cursor: default; opacity: 0.5; }
.ag-vol :focus-visible { outline: 0.16em solid ${UC}; outline-offset: 0.14em; }

/* -- the closed pill: the race clock's twin, in the other top corner -------- */
.ag-vol-pill { display: flex; align-items: center; gap: 0.5em;
  padding: 0.24em 0.7em; letter-spacing: 0.04em; white-space: nowrap;
  opacity: 0.6; }
.ag-vol-pill:hover, .ag-vol-pill:focus-visible { opacity: 1; }
/* Opacity is a function of STATE and never of time: a muted or open control is
   fully lit, an idle one steps back. A posed plate is reproducible because of it. */
.ag-vol[data-lit='1'] .ag-vol-pill { opacity: 1; }
/* RED IS BOUND TO AUDIBILITY, NOT TO THE MUTE FLAG. data-silenced is true for a
   mute, for a master on the floor and for the on-power row on the floor -- three
   routes to one silence, and round 2 painted only the first of them. */
.ag-vol[data-silenced='1'] .ag-vol-pill { border-color: ${WC};
  background: rgba(96,26,10,0.9); }
.ag-vol-horn { width: 1.3em; height: 1.3em; flex: none; }
.ag-vol-horn svg { display: block; width: 100%; height: 100%; }
.ag-vol-pill-text { font-size: 0.85em; }
.ag-vol-pill-text:empty { display: none; }

/* -- the segment meter, shared by the pill and every panel row ------------- */
.ag-vol-meter { display: flex; align-items: stretch; gap: 0.12em; }
.ag-vol-seg { border-radius: 0.14em; background: rgba(244,233,210,0.22);
  box-shadow: inset 0 0 0 0.06em rgba(40,18,8,0.5); }
.ag-vol-seg[data-on='1'] { background: ${UC}; }
.ag-vol-pill .ag-vol-meter { height: 0.85em; }
.ag-vol-pill .ag-vol-seg { width: 0.28em; }
.ag-vol[data-silenced='1'] .ag-vol-seg[data-on='1'] { background: rgba(244,233,210,0.3); }

/* -- the muted warning: persistent, and it names what was lost -------------
   IT IS NEVER display:none, AND THAT IS THE POINT. It is a role=status /
   aria-live region, and an aria-live region that is INSERTED already populated is
   the documented pattern screen readers miss: the announcement fires on a content
   mutation inside a region that was already in the accessibility tree. With
   display:none the node is not in the tree at all until the moment it fills,
   so the region and its text arrive together and there is nothing to announce.
   Measured with CDP Accessibility.getFullAXTree before this change: no status
   node before the presses, node and text together after.

   So the box is always rendered and always empty, and only the TEXT changes.
   Empty it carries no padding, no border and no background, which is zero
   painted pixels and zero layout height -- volume.test.ts and the plates below
   pin that the closed control looks identical either way.

   IT IS PAINTED FROM data-cue-lost, NOT data-silenced. Round 5 added a fifth way
   to lose the cue -- the water playing under a fairground louder than it in the
   water's own band -- and that one is emphatically NOT a silence: the horn must
   not be slashed and the meter must not be greyed over a mix making plenty of
   noise. So the two attributes split: data-silenced paints the FACE, and
   data-cue-lost paints THIS. */
.ag-vol-warn { max-width: 100%; padding: 0; border: 0 solid ${WC};
  border-radius: 0.8em; background: none; }
.ag-vol[data-cue-lost='1'] .ag-vol-warn { padding: 0.4em 0.7em; border-width: 0.16em;
  background: rgba(96,26,10,0.9); margin-bottom: 0.5em; }
.ag-vol-warn-title { font-size: 0.9em; letter-spacing: 0.06em; color: #ffab8f; }
.ag-vol-warn-advice { font-size: 0.72em; font-weight: 600; line-height: 1.25;
  color: ${HC}; opacity: 0.92; }

/* -- the panel ------------------------------------------------------------- */
.ag-vol-panel { display: none; width: 100%; pointer-events: auto;
  padding: 0.7em 0.8em 0.6em; border-radius: 1em;
  border: 0.16em solid rgba(244,233,210,0.45); background: rgba(28,28,36,0.92); }
.ag-vol[data-open='1'] .ag-vol-panel { display: block; }
.ag-vol-title { font-size: 0.78em; letter-spacing: 0.14em; color: ${UC};
  margin-bottom: 0.5em; }
.ag-vol-row { display: grid; grid-template-columns: 4.9em 1fr; align-items: center;
  column-gap: 0.5em; margin-bottom: 0.3em; }
.ag-vol-label { font-size: 0.74em; font-weight: 600; letter-spacing: 0.03em;
  color: ${HC}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-vol-bar { pointer-events: auto; cursor: pointer; padding: 0.18em 0;
  touch-action: none; }
.ag-vol-bar .ag-vol-meter { height: 0.8em; }
.ag-vol-bar .ag-vol-seg { flex: 1 1 0; }
/* The on-power row is the one the mute warning is about, so it is marked in the
   panel too: brass segments, a brass rule under the label, never dimmed. */
.ag-vol-row[data-accuracy='1'] .ag-vol-label { color: ${UC};
  border-bottom: 0.1em solid rgba(233,183,90,0.5); }
.ag-vol-actions { display: flex; gap: 0.4em; margin-top: 0.5em; }
.ag-vol-actions button { flex: 1 1 0; padding: 0.32em 0.4em; font-size: 0.72em;
  letter-spacing: 0.05em; }
.ag-vol-note { font-size: 0.66em; font-weight: 600; line-height: 1.3;
  color: ${HC}; opacity: 0.75; margin-top: 0.45em; }
.ag-vol-hint { font-size: 0.64em; font-weight: 600; letter-spacing: 0.03em;
  color: ${HC}; opacity: 0.6; margin-top: 0.45em; }

@media (prefers-reduced-motion: reduce) {
  .ag-vol * { animation: none !important; transition: none !important; }
}
